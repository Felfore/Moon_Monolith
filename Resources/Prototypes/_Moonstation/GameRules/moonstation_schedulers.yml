# Basic & Bluespace Schedulers
- type: entity
  id: MoonstationBasicEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: MoonBasicGameRulesTable
    minimumTimeUntilFirstEvent: 200 # ~3.3 minutes
    minMaxEventTiming:
      min: 180 # 3 minutes
      max: 600 # 10 minutes

- type: entity
  id: MoonstationBluespaceEventScheduler
  parent: BaseGameRule
  components:
